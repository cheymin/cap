name = "cap"
main = "src/index.js"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# 静态资源（登录页、dashboard JS、CSS、字体等）
# dashboard.html 不在此目录中，由 Worker 鉴权后返回
[assets]
directory = "./public"
binding = "ASSETS"

# D1 数据库：sitekey / session / metrics / settings 等
[[d1_databases]]
binding = "DB"
database_name = "cap-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# 环境变量（非敏感）
[vars]
# 管理员密钥（≥12 字符）。部署后请用 `wrangler secret put ADMIN_KEY` 覆盖为真实值
ADMIN_KEY = "change-me-please-12chars"
# 演示模式：true 时任意密码可登录（仅用于公开演示）
DEMO_MODE = "false"
